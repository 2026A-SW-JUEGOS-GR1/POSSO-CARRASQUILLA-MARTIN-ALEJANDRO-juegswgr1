<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Laberinto de Drago - Phaser 3 Puzzle Game</title>
    <style>
        /* Estilos para centrar el juego perfectamente en el navegador */
        body {
            margin: 0;
            padding: 0;
            background-color: #111116; /* Fondo oscuro estético */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Añade un borde sutil y sombra al lienzo del juego */
        canvas {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);
            border: 4px solid #2d2d38;
            border-radius: 4px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <script src="MenuScene.js"></script>
    <script src="ContextScene.js"></script>
    <script src="GameScene.js"></script>
    <script src="GameOverScene.js"></script>

    <script src="main.js"></script>

</body>
</html>
